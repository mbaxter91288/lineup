<title>9v9 Team Sheet 20 Aug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --ground: #f3f0e9;
    --surface: #ffffff;
    --sunk: #f0ede5;
    --line: #ebe7dd;
    --ink: #171714;
    --muted: #7c7a71;
    --solid: #16150f;
    --solid-ink: #ffffff;
    --bibs: #cf5a2c;
    --nonbibs: #34557d;
    --pitch: #edf1e8;
    --pitch-line: rgba(23, 23, 20, .1);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(23, 23, 20, .04), 0 14px 34px -26px rgba(23, 23, 20, .5);
    --shadow-soft: 0 1px 3px rgba(23, 23, 20, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121210;
      --surface: #1b1b18;
      --sunk: #242420;
      --line: #2b2b26;
      --ink: #f2efe8;
      --muted: #9b998f;
      --solid: #f2efe8;
      --solid-ink: #16150f;
      --bibs: #f0834f;
      --nonbibs: #86aad9;
      --pitch: #182019;
      --pitch-line: rgba(255, 255, 255, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 34px -28px rgba(0, 0, 0, .9);
      --shadow-soft: 0 1px 3px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --ground: #121210;
    --surface: #1b1b18;
    --sunk: #242420;
    --line: #2b2b26;
    --ink: #f2efe8;
    --muted: #9b998f;
    --solid: #f2efe8;
    --solid-ink: #16150f;
    --bibs: #f0834f;
    --nonbibs: #86aad9;
    --pitch: #182019;
    --pitch-line: rgba(255, 255, 255, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 34px -28px rgba(0, 0, 0, .9);
    --shadow-soft: 0 1px 3px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 18px 60px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* --- header --- */
  .match { padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 20px; }
  .match-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .match h1 { font-size: 27px; font-weight: 800; letter-spacing: -.025em; margin: 6px 0 0; }
  .venue {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 6px 13px 6px 10px;
    border-radius: 8px; background: var(--sunk);
    color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none;
  }
  .venue:hover { color: var(--ink); }
  .status {
    padding: 7px 14px; border-radius: 8px;
    background: var(--solid); color: var(--solid-ink);
    font-size: 12px; font-weight: 700; letter-spacing: .04em; white-space: nowrap;
  }

  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .score .side-name { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .score .side-name.bibs { color: var(--bibs); }
  .score .side-name.non-bibs { color: var(--nonbibs); text-align: right; }
  .score .figures { font-size: 38px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 12px; }
  .score .figures .sep { color: var(--muted); font-weight: 400; }

  .scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .scorer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
  .scorer-list:last-child { text-align: right; }
  .scorer-list li { font-weight: 500; }

  .goals { color: var(--muted); font-weight: 600; font-size: 13px; padding-left: 7px; }
  .own-goal { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; margin-left: 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }

  /* --- stats --- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { padding: 14px 18px; }
  .stat .label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; margin-top: 3px; }
  .stat .value .v { color: var(--muted); font-weight: 400; font-size: 15px; padding: 0 3px; }

  /* --- controls --- */
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .spacer { flex: 1 1 auto; }

  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; border-radius: 8px;
    background: var(--surface); color: var(--muted);
    font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-soft);
    transition: background-color .15s ease, color .15s ease;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--solid); color: var(--solid-ink); }
  .chip .star { display: inline-flex; color: #e5a63b; }
  .chip[aria-pressed="true"] .star { color: #f6c76a; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    transition: background-color .15s ease, color .15s ease;
  }
  .icon-btn:hover { color: var(--ink); }
  .segmented { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--sunk); }
  .segmented .icon-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
  .solo { background: var(--sunk); }

  /* tooltips */
  .tip { position: relative; }
  .tip::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(3px);
    padding: 5px 9px; border-radius: 6px;
    background: var(--solid); color: var(--solid-ink);
    font-size: 12px; font-weight: 600; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .14s ease, transform .14s ease;
  }
  .tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* --- team tables --- */
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .team { padding: 20px 22px 12px; }
  .team-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; }
  .team-name { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; }
  .bibs .swatch { background: var(--bibs); }
  .non-bibs .swatch { background: var(--nonbibs); }
  .bibs .team-name { color: var(--bibs); }
  .non-bibs .team-name { color: var(--nonbibs); }
  .team-shape { font-size: 12px; font-weight: 500; color: var(--muted); }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 0 10px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 10px 0; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
  th + th, td + td { padding-left: 14px; }
  .player { width: 100%; font-weight: 600; }
  .pos { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 5px; background: var(--sunk); color: var(--muted); }
  .rating { font-weight: 700; }
  .fitness { color: var(--muted); font-weight: 500; }
  tfoot td { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  tfoot .rating, tfoot .fitness { color: var(--ink); font-size: 15px; letter-spacing: 0; }

  /* --- pitch --- */
  .pitch-card { padding: 14px; }
  .pitch {
    position: relative; background: var(--pitch); border-radius: 8px;
    aspect-ratio: 16 / 10; display: flex; padding: 12px; color: var(--ink);
  }
  .markings { position: absolute; inset: 12px; pointer-events: none; }
  .markings .halfway { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px solid var(--pitch-line); }
  .markings .circle { position: absolute; left: 50%; top: 50%; width: 15%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 1.5px solid var(--pitch-line); border-radius: 50%; }
  .markings .box { position: absolute; top: 50%; transform: translateY(-50%); width: 10%; height: 44%; border: 1.5px solid var(--pitch-line); }
  .markings .box.left { left: 0; border-left: none; }
  .markings .box.right { right: 0; border-right: none; }

  .side { flex: 1; display: flex; gap: 2px; min-width: 0; }
  .side.non-bibs { flex-direction: row-reverse; }
  .band { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; min-width: 0; }
  .band.keeper { flex: 0 0 12%; }
  .spot { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 100%; }
  .shirt {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    color: #fff; font-size: 13px; font-weight: 700;
    box-shadow: 0 3px 8px -3px rgba(23, 23, 20, .5);
    transition: background-color .45s ease;
  }
  .spot.bibs .shirt { background: var(--bibs); }
  .spot.non-bibs .shirt { background: var(--nonbibs); }
  .spot .who { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.25; max-width: 82px; }
  .pitch-legend { display: flex; justify-content: space-between; gap: 12px; padding: 14px 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .pitch-legend .bibs { color: var(--bibs); }
  .pitch-legend .non-bibs { color: var(--nonbibs); }

  [hidden] { display: none !important; }

  @media (max-width: 700px) {
    .pitch { flex-direction: column; aspect-ratio: 3 / 4; }
    .markings .halfway { left: 0; right: 0; top: 50%; bottom: auto; border-left: none; border-top: 1.5px solid var(--pitch-line); }
    .markings .box { top: auto; left: 50%; transform: translateX(-50%); width: 44%; height: 10%; }
    .markings .box.left { top: 0; border-top: none; border-left: 1.5px solid var(--pitch-line); }
    .markings .box.right { bottom: 0; border-bottom: none; border-right: 1.5px solid var(--pitch-line); }
    .side { flex-direction: column; }
    .side.non-bibs { flex-direction: column-reverse; }
    .band { flex-direction: row; }
    .spot .who { max-width: 68px; }
    .match h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<script>

    const data = JSON.parse(document.getElementById("data").textContent);
    const options = data.options;

    const bands = ["GK", "DEF", "MID", "ATT"];

        ? "<tr><th>Player</th><th>Pos</th></tr>"
        : "<tr><th>Player</th><th>Pos</th><th>Rating</th><th>Fitness</th></tr>";

      const body = document.getElementById(prefix + "-body");
      body.innerHTML = "";
      team.players.forEach(function (player) {
        const row = document.createElement("tr");
        row.innerHTML = isPlayerPage
          ? '<td class="player"></td><td><span class="pos"></span></td>'
          : '<td class="player"></td><td><span class="pos"></span></td>' +
            '<td class="rating"></td><td class="fitness"></td>';
        row.querySelector(".player").textContent = player.name;
        if (player.goals) {
          const marker = document.createElement("span");
          marker.className = "goals";
          marker.textContent = player.goals > 1 ? "⚽ ×" + player.goals : "⚽";
          row.querySelector(".player").appendChild(marker);
        }
        if (player.own_goals) {
          const marker = document.createElement("span");
          marker.className = "own-goal";
          marker.textContent = player.own_goals > 1 ? "OG ×" + player.own_goals : "OG";
          row.querySelector(".player").appendChild(marker);
        }
        row.querySelector(".pos").textContent = player.position;
        if (!isPlayerPage) {
          row.querySelector(".rating").textContent = fmt(player.rating);
          row.querySelector(".fitness").textContent = fmt(player.fitness);
        }
        body.appendChild(row);
      });

      document.getElementById(prefix + "-shape").textContent =
        team.players.length + " players · " + shapeText(team);
      document.getElementById(prefix + "-foot").innerHTML = isPlayerPage
        ? ""
        : '<tr><td colspan="2">Total</td><td class="rating">' + fmt(team.rating) +
          '</td><td class="fitness">' + fmt(team.fitness) + "</td></tr>";
    }

    function initials(name) {
      return name.trim().split(" ").map(function (part) { return part[0]; }).join("").slice(0, 2).toUpperCase();
    }

    function creditedTo(team, others) {
      const scored = team.players
        .filter(function (p) { return p.goals; })
        .map(function (p) { return p.goals > 1 ? p.name + " ×" + p.goals : p.name; });
      const ownGoals = others.players
        .filter(function (p) { return p.own_goals; })
        .map(function (p) {
          return p.own_goals > 1 ? p.name + " (og) ×" + p.own_goals : p.name + " (og)";
        });
      return scored.concat(ownGoals);
    }

    function fillScorers(option) {
      const bibsCredit = creditedTo(option.bibs, option.non_bibs);
      const nonBibsCredit = creditedTo(option.non_bibs, option.bibs);
      const box = document.getElementById("scorers");
      if (!bibsCredit.length && !nonBibsCredit.length) { box.hidden = true; return; }
      box.hidden = false;
      [["scorers-bibs", bibsCredit], ["scorers-non-bibs", nonBibsCredit]].forEach(function (pair) {
        const list = document.getElementById(pair[0]);
        list.innerHTML = "";
        pair[1].forEach(function (text) {
          const item = document.createElement("li");
          item.textContent = text;
          list.appendChild(item);
        });
      });
    }

    function spotFor(player, team) {
      let spot = spots[player.name];
      if (!spot) {
        spot = document.createElement("div");
        spot.className = "spot";
        spot.innerHTML = '<span class="shirt"></span><span class="who"></span>';
        spot.querySelector(".who").textContent = player.name;
        spots[player.name] = spot;
      }
      spot.classList.toggle("bibs", team === "bibs");
      spot.classList.toggle("non-bibs", team === "non-bibs");
      spot.querySelector(".shirt").textContent =
        isPlayerPage ? initials(player.name) : fmt(player.rating);
      return spot;
    }

    function layoutPitch(option) {
      [["pitch-bibs", option.bibs, "bibs"], ["pitch-non-bibs", option.non_bibs, "non-bibs"]]
        .forEach(function (entry) {
          const side = document.getElementById(entry[0]);
          const team = entry[1];
          side.innerHTML = "";

          const keepers = team.players.filter(function (p) { return p.position === "GK" || p.in_goal; });
          if (keepers.length) {
            const band = document.createElement("div");
            band.className = "band keeper";
            keepers.forEach(function (p) { band.appendChild(spotFor(p, entry[2])); });
            side.appendChild(band);
          }

          ["DEF", "MID", "ATT"].forEach(function (position) {
            const players = team.players.filter(function (p) {
              return p.position === position && !p.in_goal;
            });
            if (!players.length) { return; }
            const band = document.createElement("div");
            band.className = "band";
            players.forEach(function (p) { band.appendChild(spotFor(p, entry[2])); });
            side.appendChild(band);
          });
        });
    }

    function animatePitch(option) {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const visible = !document.getElementById("pitch-view").hidden;
      const before = {};
      if (visible && !reduced) {
        Object.keys(spots).forEach(function (name) {
          if (spots[name].isConnected) { before[name] = spots[name].getBoundingClientRect(); }
        });
      }

      layoutPitch(option);

      if (!visible || reduced) { return; }
      Object.keys(before).forEach(function (name) {
        const spot = spots[name];
        if (!spot.isConnected) { return; }
        const now = spot.getBoundingClientRect();
        const dx = before[name].left - now.left;
        const dy = before[name].top - now.top;
        if (!dx && !dy) { return; }
        spot.style.transition = "none";
        spot.style.transform = "translate(" + dx + "px, " + dy + "px)";
        spot.getBoundingClientRect();
        spot.style.transition = "transform .55s cubic-bezier(.22,.61,.36,1)";
        spot.style.transform = "translate(0, 0)";
      });
    }

    function show(index) {
      current = (index + options.length) % options.length;
      const option = options[current];

      Array.prototype.forEach.call(chips.children, function (chip, i) {
        chip.setAttribute("aria-pressed", i === current ? "true" : "false");
      });

      if (!isPlayerPage) {
        document.getElementById("stats").innerHTML =
        stat("Rating", fmt(option.bibs.rating), fmt(option.non_bibs.rating)) +
        stat("Fitness", fmt(option.bibs.fitness), fmt(option.non_bibs.fitness)) +
        stat("Top three", fmt(option.bibs.top3), fmt(option.non_bibs.top3)) +
        stat("Shape", formation(option.bibs), formation(option.non_bibs));
      }

      fillTable("bibs", option.bibs);
      fillTable("non-bibs", option.non_bibs);
      fillScorers(option);
      animatePitch(option);

      document.getElementById("pitch-bibs-label").textContent = isPlayerPage
        ? "Bibs · " + shapeText(option.bibs)
        : "Bibs " + fmt(option.bibs.rating) + " · " + shapeText(option.bibs);
      document.getElementById("pitch-non-bibs-label").textContent = isPlayerPage
        ? shapeText(option.non_bibs) + " · Non-bibs"
        : shapeText(option.non_bibs) + " · " + fmt(option.non_bibs.rating) + " Non-bibs";
    }

    function stat(label, a, b) {
      return '<div class="card stat"><div class="label">' + label + '</div><div class="value">' +
        a + '<span class="v">v</span>' + b + "</div></div>";
    }

    function formation(team) {
      return ["DEF", "MID", "ATT"]
        .map(function (pos) { return team.shape[pos]; })
        .join("-");
    }

    function setView(view) {
      const isTable = view === "table";
      document.getElementById("table-view").hidden = !isTable;
      document.getElementById("pitch-view").hidden = isTable;
      document.getElementById("view-table").setAttribute("aria-pressed", isTable ? "true" : "false");
      document.getElementById("view-pitch").setAttribute("aria-pressed", isTable ? "false" : "true");
      if (!isTable) { layoutPitch(options[current]); }
    }

    document.getElementById("view-table").addEventListener("click", function () { setView("table"); });
    document.getElementById("view-pitch").addEventListener("click", function () { setView("pitch"); });
    document.getElementById("prev").addEventListener("click", function () { show(current - 1); });
    document.getElementById("next").addEventListener("click", function () { show(current + 1); });

    document.addEventListener("keydown", function (event) {
      if (options.length < 2) { return; }
      if (event.key === "ArrowLeft") { show(current - 1); }
      if (event.key === "ArrowRight") { show(current + 1); }
    });

    document.getElementById("copy").addEventListener("click", function (event) {
      const option = options[current];
      const lines = [meta.heading];
      if (meta.venue) { lines.push(meta.venue.text); }
      [["BIBS", option.bibs], ["NON-BIBS", option.non_bibs]].forEach(function (pair) {
        lines.push("");
        lines.push(pair[0]);
        pair[1].players.forEach(function (player) {
          lines.push("  " + player.name + " (" + player.position + ")");
        });
      });
      navigator.clipboard.writeText(lines.join("\n")).then(function () {
        const button = event.currentTarget;
        button.setAttribute("data-tip", "Copied");
        setTimeout(function () { button.setAttribute("data-tip", "Copy teams"); }, 1600);
      });
    });

    show(current);
  })();
</script>
